[project]
name = "geomn-ai"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.1",
    "sqlmodel==0.0.22",
    "aiosqlite==0.20.0",
    "numpy==1.26.4",
    "reportlab==4.2.2",
    "scipy==1.13.0",
    "pandas==2.2.2",
    "scikit-learn==1.5.0",
    "lightgbm==4.3.0",
    "xgboost==2.0.3",
    "pillow==10.3.0",
    "matplotlib==3.8.4"
]

[tool.vercel]
entrypoint = "backend.app.main:app"